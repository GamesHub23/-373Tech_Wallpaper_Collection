<body>

<header class="topbar">
    <a class="brand" href="../index.html">
        <span class="brand-mark">+373</span>
        <span class="brand-name">TECH<span class="dot">.</span></span>
    </a>
    <a class="back-link" href="../index.html">← HOME</a>
</header>

<main class="page wallpapers-page">

<p class="kicker">03 / WALLPAPER ARCHIVE</p>
<h1>The wallpapers itself<span>.</span></h1>
<p class="lead">
Choose what wallpaper you want, preview the animation, then download your favourite
<strong>.tendies</strong> file. I will upload here the wallpapers.
</p>

<div class="wallpaper-grid">

<script>
const wallpapers = [
    ["Spooky iPhone11", "Spooky_iPhone11"],
    ["Spooky iPhoneXS", "Spooky_iPhoneXS"],
    ["Spooky iPhoneXR", "Spooky_iPhoneXR"],
    ["Spooky iPhone11Pro", "Spooky_iPhone11Pro"],
    ["Spooky iPhone12", "Spooky_iPhone12"],
    ["Spooky iPhone13Pro", "Spooky_iPhone13Pro"],
    ["Spooky iPhone13-14-15", "Spooky_iPhone13-14-15"],
    ["Spooky iPhone15Mitya", "Spooky_iPhone15Mitya"],
    ["Spooky iPhone16Pro", "Spooky_iPhone16Pro"],
    ["Spooky iPhone16", "Spooky_iPhone16"],
    ["Spooky iPhone17Pro", "Spooky_iPhone17Pro"]
];

wallpapers.forEach(([name, file]) => {
    document.write(`
        <article class="wallpaper-card">
            <h2>${name}</h2>

            <div class="preview-frame">
                <img
                    src="../WallpapersPreview/${file}.gif"
                    alt="${name} animated wallpaper preview"
                    loading="eager"
                    decoding="sync"
                    class="wallpaper-gif"
                >
                <span class="preview-overlay">ANIMATED PREVIEW</span>
            </div>

            <a class="download-button"
               href="${file}.tendies"
               download>
               ↓ &nbsp; Download Tendies
            </a>
        </article>
    `);
});
</script>

</div>

<p class="footnote">
A preview or download will work once its matching GIF or .tendies file is uploaded to its folder.
</p>

</main>

<script>
// Reload GIF previews to avoid showing a cached first frame.
window.addEventListener("load", () => {
    document.querySelectorAll(".wallpaper-gif").forEach(img => {
        const originalSrc = img.getAttribute("src");
        img.src = originalSrc + "?refresh=" + Date.now();
    });
});
</script>

</body>
</html>
